" text-anchor="start" style="">floor = min(end-of-day peak − $2,000, 0)</text><text x="66.0" y="36.0" fill="var(--muted)" font-size="11.5" font-weight="400" text-anchor="start" style="">it ratchets up each profitable day, then pins at breakeven — one resampled path</text><text x="534.0" y="165.3" fill="var(--ink)" font-size="11" font-weight="700" text-anchor="start" style="letter-spacing:.06em">PHASE 1</text><text x="534.0" y="180.3" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">reach a +$2,000</text><text x="534.0" y="193.3" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">end-of-day peak</text><text x="534.0" y="211.3" fill="var(--s1)" font-size="17" font-weight="700" text-anchor="start" font-variant-numeric="tabular-nums" style="">38.2%</text><text x="534.0" y="239.3" fill="var(--ink)" font-size="11" font-weight="700" text-anchor="start" style="letter-spacing:.06em">PHASE 2</text><text x="534.0" y="254.3" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">static barrier,</text><text x="534.0" y="267.3" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">2000/3000 — fixed</text><text x="534.0" y="285.3" fill="var(--s2)" font-size="17" font-weight="700" text-anchor="start" font-variant-numeric="tabular-nums" style="">66.7%</text><line x1="534.0" y1="297.3" x2="644.0" y2="297.3" stroke="var(--axis)" stroke-width="1" stroke-linecap="butt"/><text x="534.0" y="315.3" fill="var(--ink)" font-size="17" font-weight="700" text-anchor="start" font-variant-numeric="tabular-nums" style="">25.4%</text><text x="592.0" y="315.3" fill="var(--muted)" font-size="10.5" font-weight="400" text-anchor="start" style="">measured 25.8%</text></svg>