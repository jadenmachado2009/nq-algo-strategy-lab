oke-width="2"/><text x="351.2" y="362.0" fill="var(--ink2)" font-size="11.5" font-weight="600" text-anchor="middle" style="">3.0%</text><text x="351.2" y="377.0" fill="var(--muted)" font-size="10" font-weight="400" text-anchor="middle" style="">$1,500</text><circle cx="447.6" cy="245.3" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><circle cx="447.6" cy="277.0" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><text x="447.6" y="362.0" fill="var(--ink2)" font-size="11.5" font-weight="600" text-anchor="middle" style="">4.0%</text><text x="447.6" y="377.0" fill="var(--muted)" font-size="10" font-weight="400" text-anchor="middle" style="">$2,000</text><circle cx="544.0" cy="253.3" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><circle cx="544.0" cy="284.0" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><text x="544.0" y="362.0" fill="var(--ink2)" font-size="11.5" font-weight="600" text-anchor="middle" style="">6.0%</text><text x="544.0" y="377.0" fill="var(--muted)" font-size="10" font-weight="400" text-anchor="middle" style="">$3,000</text><text x="72.0" y="66.3" fill="var(--s1)" font-size="12.5" font-weight="650" text-anchor="start" style="">with ORB's edge</text><text x="72.0" y="267.8" fill="var(--s2)" font-size="12.5" font-weight="650" text-anchor="start" style="">zero edge</text><line x1="62.0" y1="83.3" x2="62.0" y2="240.8" stroke="var(--ink2)" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 2"/><text x="74.0" y="166.1" fill="var(--ink)" font-size="12" font-weight="700" text-anchor="start" font-variant-numeric="tabular-nums" style="">+46.9 pts</text><line x1="544.0" y1="260.3" x2="544.0" y2="277.0" stroke="var(--ink2)" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 2"/><text x="532.0" y="272.6" fill="var(--ink)" font-size="12" font-weight="700" text-anchor="end" font-variant-numeric="tabular-nums" style="">+8.4 pts</text><line x1="62.0" y1="342.0" x2="62.0" y2="42.0" stroke="var(--axis)" stroke-width="1" stroke-linecap="butt"/><line x1="62.0" y1="342.0" x2="544.0" y2="342.0" stroke="var(--axis)" stroke-width="1" stroke-linecap="butt"/><text x="303.0" y="394.0" fill="var(--ink2)" font-size="11.5" font-weight="400" text-anchor="middle" style="">risk per trade</text><text x="62.0" y="20.0" fill="var(--ink)" font-size="14.5" font-weight="650" text-anchor="start" style="">What an edge is worth, against what you bet</text><text x="62.0" y="36.0" fill="var(--muted)" font-size="11.5" font-weight="400" text-anchor="start" style="">same trades, same rules — the only difference is whether the edge is left in</text><text x="556.0" y="70.0" fill="var(--ink)" font-size="11.5" font-weight="650" text-anchor="start" style="">Betting 12x larger</text><text x="556.0" y="85.0" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">buys ~10 points of</text><text x="556.0" y="98.0" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">zero-edge pass rate</text><text x="556.0" y="111.0" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">and gives up five</text><text x="556.0" y="124.0" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">sixths of what skill</text><text x="556.0" y="137.0" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">is worth.</text><text x="556.0" y="162.0" fill="var(--muted)" font-size="10.5" font-weight="400" text-anchor="start" style="">Absolutes inflated by</text><text x="556.0" y="174.0" fill="var(--muted)" font-size="10.5" font-weight="400" text-anchor="start" style="">independent draws. The</text><text x="556.0" y="186.0" fill="var(--muted)" font-size="10.5" font-weight="400" text-anchor="start" style="">session-replay model</text><text x="556.0" y="198.0" fill="var(--muted)" font-size="10.5" font-weight="400" text-anchor="start" style="">gives +7.2 pts at 0.50%</text><text x="556.0" y="210.0" fill="var(--muted)" font-size="10.5" font-weight="400" text-anchor="start" style="">and +4.1 at 1.00% —</text><text x="556.0" y="222.0" fill="var(--muted)" font-size="10.5" font-weight="400" text-anchor="start" style="">same direction.</text></svg>