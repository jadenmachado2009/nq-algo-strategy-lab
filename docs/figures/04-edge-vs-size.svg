<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pass rate with and without an edge across risk per trade" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><title>Edge against bet size</title><style>svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--crit:#d03b3b;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--surface:#fcfcfb}@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--crit:#d03b3b;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--surface:#1a1a19}}</style><rect x="0" y="0" width="720" height="400" fill="var(--surface)"/><line x1="62.0" y1="342.0" x2="544.0" y2="342.0" stroke="var(--grid)" stroke-width="1" stroke-linecap="butt"/><text x="52.0" y="346.0" fill="var(--muted)" font-size="11" font-weight="400" text-anchor="end" font-variant-numeric="tabular-nums" style="">0%</text><line x1="62.0" y1="269.0" x2="544.0" y2="269.0" stroke="var(--grid)" stroke-width="1" stroke-linecap="butt"/><text x="52.0" y="273.0" fill="var(--muted)" font-size="11" font-weight="400" text-anchor="end" font-variant-numeric="tabular-nums" style="">20%</text><line x1="62.0" y1="196.0" x2="544.0" y2="196.0" stroke="var(--grid)" stroke-width="1" stroke-linecap="butt"/><text x="52.0" y="200.0" fill="var(--muted)" font-size="11" font-weight="400" text-anchor="end" font-variant-numeric="tabular-nums" style="">40%</text><line x1="62.0" y1="123.0" x2="544.0" y2="123.0" stroke="var(--grid)" stroke-width="1" stroke-linecap="butt"/><text x="52.0" y="127.0" fill="var(--muted)" font-size="11" font-weight="400" text-anchor="end" font-variant-numeric="tabular-nums" style="">60%</text><line x1="62.0" y1="50.0" x2="544.0" y2="50.0" stroke="var(--grid)" stroke-width="1" stroke-linecap="butt"/><text x="52.0" y="54.0" fill="var(--muted)" font-size="11" font-weight="400" text-anchor="end" font-variant-numeric="tabular-nums" style="">80%</text><polygon points="62.0,76.3 158.4,140.5