6.0" y="22.0" fill="var(--ink)" font-size="14.5" font-weight="650" text-anchor="start" style="">You buy speed with skill. There is no third option.</text><text x="66.0" y="38.0" fill="var(--muted)" font-size="11.5" font-weight="400" text-anchor="start" style="">vertical axis is how many points the edge adds over an identical zero-edge trader</text><text x="568.0" y="72.0" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">Left and up is</text><text x="568.0" y="85.0" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">better: fewer days,</text><text x="568.0" y="98.0" fill="var(--ink2)" font-size="11" font-weight="400" text-anchor="start" style="">more of it earned.</text><text x="568.0" y="122.0" fill="var(--s1)" font-size="11" font-weight="650" text-anchor="start" style="">0.75R sits above</text><text x="568.0" y="135.0" fill="var(--s1)" font-size="11" font-weight="650" text-anchor="start" style="">0.50R at every</text><text x="568.0" y="148.0" fill="var(--s1)" font-size="11" font-weight="650" text-anchor="start" style="">size tested.</text><text x="568.0" y="172.0" fill="var(--crit)" font-size="11" font-weight="400" text-anchor="start" style="">The curve is not</text><text x="568.0" y="185.0" fill="var(--crit)" font-size="11" font-weight="400" text-anchor="start" style="">smooth. Fixed-dollar</text><text x="568.0" y="198.0" fill="var(--crit)" font-size="11" font-weight="400" text-anchor="start" style="">rules against a</text><text x="568.0" y="211.0" fill="var(--crit)" font-size="11" font-weight="400" text-anchor="start" style="">fixed-dollar bet put</text><text x="568.0" y="224.0" fill="var(--crit)" font-size="11" font-weight="400" text-anchor="start" style="">a hole at $320 in</text><text x="568.0" y="237.0" fill="var(--crit)" font-size="11" font-weight="400" text-anchor="start" style="">all three curves.</text><text x="568.0" y="250.0" fill="var(--ink)" font-size="11" font-weight="650" text-anchor="start" style="">Test your size;</text><text x="568.0" y="263.0" fill="var(--ink)" font-size="11" font-weight="650" text-anchor="start" style="">never interpolate.</text></svg>